<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrainPop Daily</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#17181c;--muted:#6b7280;--line:#e5e7eb;--a:#5b5bd6;--good:#16834a;--bad:#c93535}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:21px}.lang{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px}.hero,.card,.stat,.ad{background:var(--card);border:1px solid var(--line);border-radius:20px}.hero{margin-top:16px;padding:22px;background:linear-gradient(135deg,#5b5bd6,#8a62d9);color:#fff;border:0}.hero h1{margin:0 0 6px;font-size:29px}.hero p{margin:0;color:#eee}.card{margin-top:16px;padding:20px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.q{font-size:22px;font-weight:800;line-height:1.5;margin:22px 0}.choices{display:grid;gap:10px}.choice{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left;font-size:17px}.choice.correct{background:#edf9f1;border-color:#95d7b1;color:var(--good)}.choice.wrong{background:#fff0f0;border-color:#efaaaa;color:var(--bad)}.explain{margin-top:14px;padding:14px;background:#f3f4f8;border-radius:14px;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat{text-align:center;padding:12px}.num{font-size:21px;font-weight:900}.label{font-size:12px;color:var(--muted)}.ad{margin-top:14px;padding:20px;text-align:center;color:var(--muted);border-style:dashed}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
</style></head><body><main class="wrap"><div class="top"><div class="brand">🧠 BrainPop Daily</div><button class="lang" id="lang">日本語 / EN</button></div><section class="hero"><h1 id="title"></h1><p id="subtitle"></p></section><section class="card"><div class="meta"><span id="date"></span><span id="type"></span></div><div class="q" id="q"></div><div class="choices" id="choices"></div><div id="result"></div></section><div class="stats"><div class="stat"><div class="num" id="score">0</div><div class="label" id="scoreL"></div></div><div class="stat"><div class="num" id="streak">0</div><div class="label" id="streakL"></div></div><div class="stat"><div class="num" id="solved">0</div><div class="label" id="solvedL"></div></div></div><div class="ad">📺 <span id="ad"></span></div><footer>Daily puzzle prototype. Progress is stored only in this browser.</footer></main><script>
const UI={ja:{title:'今日のひらめきチャレンジ',sub:'1日1問。答えを見つけて、連続記録を伸ばそう。',score:'スコア',streak:'連続日数',solved:'累計回答',type:{logic:'論理',sequence:'数字'},correct:'✅ 正解！',wrong:'❌ 不正解',exp:'解説',ad:'広告枠（将来、追加問題の解放などに利用）'},en:{title:"Today's Brain Challenge",sub:'One puzzle a day. Solve it and build your streak.',score:'Score',streak:'Streak',solved:'Solved',type:{logic:'Logic',sequence:'Numbers'},correct:'✅ Correct!',wrong:'❌ Not quite',exp:'Explanation',ad:'Ad slot (can later unlock bonus puzzles)'}};let ps=[],lang=localStorage.brain_lang||'ja',answered=false;
const key=()=>{let d=new Date();return d.toISOString().slice(0,10)};function stats(){return JSON.parse(localStorage.brain_stats||'{"score":0,"streak":0,"solved":0,"last":""}')}function save(s){localStorage.brain_stats=JSON.stringify(s)}function idx(){let d=new Date();return (d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate())%ps.length}
function render(){let u=UI[lang],p=ps[idx()],d=p[lang],s=stats();document.getElementById('title').textContent=u.title;document.getElementById('subtitle').textContent=u.sub;document.getElementById('scoreL').textContent=u.score;document.getElementById('streakL').textContent=u.streak;document.getElementById('solvedL').textContent=u.solved;document.getElementById('ad').textContent=u.ad;document.getElementById('date').textContent=key();document.getElementById('type').textContent=u.type[p.type];document.getElementById('q').textContent=d.question;document.getElementById('score').textContent=s.score;document.getElementById('streak').textContent=s.streak;document.getElementById('solved').textContent=s.solved;document.getElementById('result').innerHTML='';answered=false;let box=document.getElementById('choices');box.innerHTML='';d.choices.forEach((c,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(i,p);box.appendChild(b)})}
function answer(i,p){if(answered)return;answered=true;let u=UI[lang],d=p[lang],ok=i===d.answer,s=stats();document.querySelectorAll('.choice').forEach((b,n)=>{b.disabled=true;if(n===d.answer)b.classList.add('correct');if(n===i&&!ok)b.classList.add('wrong')});if(ok&&s.last!==key()){let yd=new Date();yd.setDate(yd.getDate()-1);let prev=yd.toISOString().slice(0,10);s.score+=100;s.solved++;s.streak=s.last===prev?s.streak+1:1;s.last=key();save(s)}document.getElementById('score').textContent=s.score;document.getElementById('streak').textContent=s.streak;document.getElementById('solved').textContent=s.solved;document.getElementById('result').innerHTML=`<div class="explain"><strong>${ok?u.correct:u.wrong}</strong><br><br><strong>${u.exp}</strong><br>${d.explanation}</div>`}
document.getElementById('lang').onclick=()=>{lang=lang==='ja'?'en':'ja';localStorage.brain_lang=lang;render()};fetch('puzzles.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(x=>{ps=x;render()});
</script></body></html>
